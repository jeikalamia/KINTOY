<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday! 💗</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #ffd6e7, #ffb0ce);
            font-family: Arial, sans-serif;
        }

        /* MAIN BIRTHDAY MESSAGE */

        .card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 330px;
            padding: 28px 20px;
            background: white;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(180, 70, 110, 0.25);
            z-index: 5;
            animation: cardIn 1.2s ease;
        }

        .cake {
            font-size: 70px;
            animation: bounce 1.5s infinite;
        }

        h1 {
            color: #ff4f91;
            font-size: 34px;
            font-weight: 900;
            margin: 10px 0;
        }

        h2 {
            color: #d93672;
            font-size: 21px;
        }

        p {
            color: #704052;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.5;
        }

        /* POLAROIDS */

        .polaroid {
            position: absolute;
            width: 125px;
            padding: 8px 8px 25px;
            background: white;
            box-shadow: 0 8px 18px rgba(100, 40, 60, 0.25);
            opacity: 0;
            z-index: 2;
        }

        .polaroid img {
            width: 100%;
            height: 115px;
            object-fit: cover;
            display: block;
        }

        .photo1 {
            top: 7%;
            left: 5%;
            transform: rotate(-12deg);
            animation: polaroid1 1s ease forwards;
            animation-delay: 1s;
        }

        .photo2 {
            top: 8%;
            right: 5%;
            transform: rotate(11deg);
            animation: polaroid2 1s ease forwards;
            animation-delay: 2s;
        }

        .photo3 {
            bottom: 7%;
            left: 5%;
            transform: rotate(9deg);
            animation: polaroid3 1s ease forwards;
            animation-delay: 3s;
        }

        .photo4 {
            bottom: 7%;
            right: 5%;
            transform: rotate(-11deg);
            animation: polaroid4 1s ease forwards;
            animation-delay: 4s;
        }

        .photo5 {
            top: 38%;
            right: 1%;
            transform: rotate(8deg);
            animation: polaroid5 1s ease forwards;
            animation-delay: 5s;
        }

        /* ANIMATIONS */

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.7);
            }

            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        @keyframes polaroid1 {
            from {
                opacity: 0;
                transform: translate(-80px, -80px) rotate(-30deg) scale(0.5);
            }

            to {
                opacity: 1;
                transform: rotate(-12deg);
            }
        }

        @keyframes polaroid2 {
            from {
                opacity: 0;
                transform: translate(80px, -80px) rotate(30deg) scale(0.5);
            }

            to {
                opacity: 1;
                transform: rotate(11deg);
            }
        }

        @keyframes polaroid3 {
            from {
                opacity: 0;
                transform: translate(-80px, 80px) rotate(-30deg) scale(0.5);
            }

            to {
                opacity: 1;
                transform: rotate(9deg);
            }
        }

        @keyframes polaroid4 {
            from {
                opacity: 0;
                transform: translate(80px, 80px) rotate(30deg) scale(0.5);
            }

            to {
                opacity: 1;
                transform: rotate(-11deg);
            }
        }

        @keyframes polaroid5 {
            from {
                opacity: 0;
                transform: translate(80px, 0) rotate(30deg) scale(0.5);
            }

            to {
                opacity: 1;
                transform: rotate(8deg);
            }
        }

        /* FLOATING HEARTS */

        .heart {
            position: absolute;
            bottom: -30px;
            font-size: 25px;
            animation: float 6s linear infinite;
        }

        .heart:nth-of-type(1) {
            left: 20%;
        }

        .heart:nth-of-type(2) {
            left: 50%;
            animation-delay: 2s;
        }

        .heart:nth-of-type(3) {
            left: 80%;
            animation-delay: 4s;
        }

        @keyframes float {
            0% {
                transform: translateY(0);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <!-- MUSIC -->
    <audio autoplay loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- POLAROID PHOTOS -->

    <div class="polaroid photo1">
        <img src="pic1.jpg">
    </div>

    <div class="polaroid photo2">
        <img src="pic2.jpg">
    </div>

    <div class="polaroid photo3">
        <img src="pic3.jpg">
    </div>

    <div class="polaroid photo4">
        <img src="pic4.jpg">
    </div>

    <div class="polaroid photo5">
        <img src="pic5.jpg">
    </div>

    <!-- BIRTHDAY CARD -->

    <div class="card">

        <div class="cake">🎂</div>

        <h1>HAPPY BIRTHDAY! 🎉</h1>

        <h2>To my favorite person! 💗</h2>

        <p>
            I hope your day is filled with
            happiness, laughter, and lots of love! 🥰
            <br><br>
            Enjoy your special day! 🎀✨
        </p>

    </div>

    <!-- FLOATING HEARTS -->

    <div class="heart">💗</div>
    <div class="heart">💕</div>
    <div class="heart">💖</div>

</body>
</html>
